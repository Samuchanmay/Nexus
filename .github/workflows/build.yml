name: Build check

# Corre `next build` en cada push y PR contra main. Objetivo único: que un
# build roto (como la carpeta app/ duplicada en la raíz que tumbó el chat
# varias veces) se vea en minutos aquí, no se descubra horas después en
# Vercel a mitad de una sesión de despliegue.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: next build
        # Valores dummy — este workflow solo verifica que el proyecto
        # compile, nunca despliega ni toca Supabase real. Las credenciales
        # verdaderas viven únicamente en Vercel.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_OFICINA_LAT: "20.405833"
          NEXT_PUBLIC_OFICINA_LNG: "-89.529222"
          NEXT_PUBLIC_RADIO_MAX_M: "50"
          RESEND_API_KEY: placeholder
          NOTIFY_EMAIL: noreply@example.com
        run: npm run build
